<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的个人工作台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5ecd7;color:#294b40;font:15px/1.6 system-ui}header{background:#244b43;color:#fff4d8;padding:24px}header h1{margin:0;font-size:25px}header p{font-size:12px;color:#d2d9bc}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8c69d;border-radius:16px;padding:7px 13px;background:#fff4d9;color:#39563d}button.active,button.primary{background:#efad44;color:#383f29}main{max-width:1100px;margin:auto;padding:24px}h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#fffaf0;border:1px solid #e1d2b2;border-radius:14px;padding:20px;margin-bottom:16px;overflow-wrap:anywhere}.card p{white-space:pre-wrap;font-size:13px;color:#80816c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row{display:flex;align-items:center;gap:12px;border-top:1px solid #e7ddc6;padding:14px 0}.row>div{flex:1;min-width:0}.row small{display:block;color:#90917d}.done{text-decoration:line-through;color:#999}.stat{font-size:30px}.bar{height:7px;background:#e7e6ce;border-radius:7px;margin:10px 0}.bar span{display:block;height:100%;background:#79965b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:150px}input,select,textarea{padding:9px;border:1px solid #d8c9a9;border-radius:7px;background:#fffdf6;color:#294b40}dialog{max-width:480px;width:90%;max-height:90vh;overflow:auto;border:1px solid #d8c9a9;border-radius:15px;padding:24px;background:#fffaf0}dialog::backdrop{background:#153c3866}label{display:block;margin:12px 0;font-size:13px}label input,label select,label textarea{display:block;width:100%;margin-top:5px}textarea{min-height:90px;resize:vertical}footer{max-width:1100px;margin:auto;padding:20px;font-size:12px;color:#85846e}a{color:#487b5b}#message{min-height:24px;color:#926723;font-size:13px}.empty{padding:30px;text-align:center;color:#97977c}.pill{background:#e7ebcc;padding:3px 9px;border-radius:9px;font-size:12px}.danger{color:#a44c36}button:focus-visible{outline:3px solid #9baf77}progress{width:100%}</style>
<header><h1>Leong · 我的个人工作台</h1><p>医学／医疗数据 → Data Science／AI → Finance → FinTech／投资／创业</p><nav id="nav"></nav></header><main><div id="message" role="status"></div><div id="view"></div></main>
<footer>数据保存在当前浏览器；电脑和手机不自动同步。请定期备份。<div class="actions"><button id="backup">导出备份</button><button id="restore">导入备份</button><input id="file" type="file" accept=".json" hidden></div></footer>
<dialog id="dialog"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><div class="actions"><button class="primary" type="submit">保存</button><button type="button" id="cancel">取消</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[['美国申博 · 2026申请／2027入学','优先探索医学影像AI、重建或医疗多模态AI。核实导师和官方截止日期；保留RA、研究型硕士及2028入学备选。','核实本轮官方截止日期|筛选匹配项目与导师|梳理CV及推荐人|评估直博准备度与备选路线|整理研究兴趣与申请材料'],['台湾大学暑期深度研究 · 再次申请','此前未能参加，不能记为已完成经历。计划结合AI兴趣再次申请；项目年份、开放时间、资格与费用待核实。','核实下一轮开放与申请资格|寻找AI相关研究组|准备再次申请的研究兴趣说明'],['课程重修申请','确认重修课程、申请流程、成绩计算与毕业要求。具体均分、课程和毕业月份待补充。','整理重修课程与当前成绩|核实流程与成绩计算规则|确认对毕业和学位的影响'],['雅思 · 目标8.5','个人总分目标8.5；当前水平、单项目标与考试日期待补充。院校要求需单独核实。','制定8.5目标与单项计划|完成听说读写水平诊断|制定每周练习安排|确认考试与成绩送达安排'],['Data Science／AI · 技术基础','数学与统计 → Python → SQL → pandas／NumPy → EDA → ML → 深度学习。当前熟练程度待自评。','自评数学与Python基础|安排线代概率与编程学习|完成可复现的机器学习练习'],['医学影像×AI · 科研','选一个小问题持续研究，复现基线，设计对照实验，记录失败、局限与个人贡献。数据许可和导师资源待确认。','选定候选研究问题|阅读论文并复现基线|整理导师与团队资源|设计实验记录结果与局限|记录贡献与推荐信证据'],['分析型硕士 · 比较与申请','优先比较Analytics／Data Science；再评估Financial Engineering／Quant Finance／FinTech及有技术课程的Finance。哥大MSAA为候选，官方信息待核实。','比较项目与先修要求|核实GMAT/GRE与语言要求|核实哥大MSAA官方信息|整理医疗数据到Analytics的申请故事'],['金融基础 · 商业判断','学习三张表、公司金融、经济学、投资与估值。CFA作为学习框架，尚未安排考证。','学习财务报表与公司金融|练习DCF/NPV/IRR|分析真实公司的商业模式'],['Data／Finance · 实习','探索医疗AI、Healthcare VC、医药咨询、券商医药组、FinTech和数据岗位。候选机会不是已完成经历。','整理实习候选岗位|制作交叉方向简历|准备项目展示与申请'],['数据与商业分析 · 作品','数据清洗 → EDA → 建模 → 验证 → 可视化 → 商业解释，展示代码和复现说明。','选择可合法使用的数据集|完成EDA建模与可视化|整理代码复现与商业解释']];
let db={goals:[],tasks:[],opportunities:[],thoughts:[],inspirations:[]};seed.forEach(([title,notes,tasks],i)=>{const goal='g'+i;db.goals.push({id:goal,title,notes,progress:0,start:'',due:''});tasks.split('|').forEach((title,j)=>db.tasks.push({id:'t'+i+'-'+j,title,notes:'建议待办；实际状态与日期请更新。',goal,category:seed[i][0].split(' · ')[0],status:'todo',priority:'medium',due:''}));});
let storageOK=true;try{const saved=localStorage.getItem('leong-mac-v1');if(saved)db=check(JSON.parse(saved));}catch{storageOK=false;}
let page='overview',period='all',query='',editing=null;
const labels={overview:'Overview',career:'Career',tasks:'To-do List',thoughts:'零碎想法',inspirations:'灵感',news:'每日情报'};
function check(x){if(!x||typeof x!=='object')throw Error('备份格式错误');const ids=new Set();for(const k of ['goals','tasks','opportunities','thoughts','inspirations']){if(!Array.isArray(x[k])||x[k].length>10000)throw Error('备份格式错误');for(const i of x[k]){if(!i||typeof i.id!=='string'||!i.id||ids.has(i.id)||typeof i.title!=='string'||!i.title.trim()||i.title.length>200)throw Error('记录格式错误');ids.add(i.id);for(const f of ['notes','due','start','category','goal','created'])if(i[f]!==undefined&&(typeof i[f]!=='string'||i[f].length>5000))throw Error('字段格式错误');for(const f of ['due','start'])if(i[f]&&(!/^\d{4}-\d{2}-\d{2}$/.test(i[f])||!Number.isFinite(Date.parse(i[f]))||new Date(i[f]).toISOString().slice(0,10)!==i[f]))throw Error('日期格式错误');if(k==='goals'&&(!Number.isInteger(i.progress)||i.progress<0||i.progress>100||(i.start&&i.due&&i.start>i.due)))throw Error('目标进度或日期无效');if(k==='tasks'&&(!['todo','doing','done'].includes(i.status)||!['high','medium','low'].includes(i.priority)))throw Error('任务状态无效');if(k==='opportunities'&&!['待了解','已申请','面试中','已获得','已结束'].includes(i.stage))throw Error('机会状态无效');}}return x;}
function message(text){$('#message').textContent=text;}
function commit(next){try{check(next);localStorage.setItem('leong-mac-v1',JSON.stringify(next));db=next;storageOK=true;render();message('已保存');return true;}catch(e){message('保存失败：'+e.message);return false;}}
function change(action){const next=structuredClone(db);action(next);return commit(next);}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function inPeriod(t){if(period==='all')return true;if(period==='unscheduled')return !t.due;if(!t.due)return false;if(period==='today')return t.due===today();if(period==='month')return t.due.slice(0,7)===today().slice(0,7);const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const start=iso(d);d.setDate(d.getDate()+6);return t.due>=start&&t.due<=iso(d);}
function buttons(kind,id){return `<div class="actions"><button data-edit="${kind}:${escape(id)}">编辑</button><button class="danger" data-delete="${kind}:${escape(id)}">删除</button></div>`;}
function task(t){return `<div class="row"><button data-toggle="${escape(t.id)}" aria-label="${t.status==='done'?'恢复':'完成'}${escape(t.title)}">${t.status==='done'?'✓':'○'}</button><div><span class="${t.status==='done'?'done':''}">${escape(t.title)}</span><small>${escape(t.category||'未分类')} · ${escape(t.due||'未安排日期')} · ${{todo:'待开始',doing:'进行中',done:'已完成'}[t.status]} · ${{high:'高',medium:'中',low:'低'}[t.priority]}优先级</small></div><button data-edit="tasks:${escape(t.id)}">编辑</button><button data-delete="tasks:${escape(t.id)}" aria-label="删除${escape(t.title)}">×</button></div>`;}
function cards(kind){return db[kind].filter(i=>(i.title+' '+(i.notes||'')+' '+(i.category||'')).toLowerCase().includes(query.toLowerCase())).map(i=>`<article class="card"><span class="pill">${escape(i.category||i.stage||labels[kind]||'职业目标')}</span><h3>${escape(i.title)}</h3><p>${escape(i.notes||'')}</p>${kind==='goals'?`<progress max="100" value="${i.progress}"></progress><small>目标完成度 ${i.progress}% · ${escape(i.start||'开始日期待定')} → ${escape(i.due||'结束日期待定')}</small>`:''}${buttons(kind,i.id)}</article>`).join('')||'<div class="empty">暂时没有记录，可以点击新增。</div>';}
function render(){$('#nav').innerHTML=Object.entries(labels).map(([p,n])=>`<button data-page="${p}" class="${p===page?'active':''}">${n}</button>`).join('');let html=`<h2>${labels[page]}</h2>`;
if(page==='overview'){html+='<p>2026申请 · 2027入学 · 雅思8.5 · 台湾暑研再次申请</p><div class="grid">'+[['待办',db.tasks.filter(t=>t.status!=='done').length],['已完成',db.tasks.filter(t=>t.status==='done').length],['职业目标',db.goals.length],['跟进机会',db.opportunities.filter(o=>o.stage!=='已结束').length]].map(([n,v])=>`<div class="card">${n}<div class="stat">${v}</div></div>`).join('')+'</div><div class="card"><h3>当前重点</h3>'+db.tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||['high','medium','low'].indexOf(a.priority)-['high','medium','low'].indexOf(b.priority)).slice(0,4).map(task).join('')+'</div><div class="card"><h3>任务分布</h3>'+[...new Set(db.tasks.map(t=>t.category||'未分类'))].map(c=>{const n=db.tasks.filter(t=>(t.category||'未分类')===c).length;return `<div>${escape(c)} · ${n}<div class="bar"><span style="width:${db.tasks.length?n/db.tasks.length*100:0}%"></span></div></div>`;}).join('')+'</div>';}
else if(page==='career'){html+='<p>技术理解、金融判断与商业决策能力。硕士与申博路线并行比较。</p><button data-new="goals" class="primary">＋职业目标</button><div class="grid">'+cards('goals')+'</div><h2>机会／申请记录</h2><button data-new="opportunities">＋机会</button><div class="grid">'+cards('opportunities')+'</div>';}
else if(page==='tasks'){html+='<button class="primary" data-new="tasks">＋任务</button><div class="toolbar">'+[['all','全部'],['today','Today'],['week','Week'],['month','Month'],['unscheduled','未安排']].map(([k,n])=>`<button data-period="${k}" class="${period===k?'active':''}">${n}</button>`).join('')+'</div><p>按目标日期查看，本周为周一至周日。</p><input id="search" placeholder="搜索任务" value="'+escape(query)+'"><div class="card" id="results">'+db.tasks.filter(t=>inPeriod(t)&&(t.title+' '+t.notes+' '+t.category).toLowerCase().includes(query.toLowerCase())).map(task).join('')+'</div>';}
else if(page==='news'){html+='<div class="card"><p>本地HTML暂未连接自动新闻服务，以下是原始来源入口。此处不会显示虚构简报。</p><p><a target="_blank" rel="noopener" href="https://techcrunch.com/category/artificial-intelligence/">TechCrunch AI 科技 ↗</a></p><p><a target="_blank" rel="noopener" href="https://arxiv.org/list/cs.AI/recent">arXiv AI研究 ↗</a></p><p><a target="_blank" rel="noopener" href="https://www.bbc.com/business">BBC经济与商业 ↗</a></p></div>';}
else{html+='<p>'+ (page==='thoughts'?'随手记录疑问、观察、感受和未成形的思考。':'保存研究点子、创意与想尝试的新可能。')+'</p><button class="primary" data-new="'+page+'">＋新增</button><div class="toolbar"><input id="search" placeholder="搜索当前记录" value="'+escape(query)+'"></div><div class="grid" id="results">'+cards(page)+'</div>';}
$('#view').innerHTML=html;}
function field(n,title,value='',type='text',extra=''){return `<label>${title}<input name="${n}" type="${type}" value="${escape(value)}" ${extra}></label>`;}
function options(n,title,values,value){return `<label>${title}<select name="${n}">${values.map(([v,l])=>`<option value="${escape(v)}" ${value===v?'selected':''}>${escape(l)}</option>`).join('')}</select></label>`;}
function edit(kind,id){const item=id?db[kind].find(i=>i.id===id):{};if(!item)return;editing={kind,id};$('#formTitle').textContent=id?'编辑记录':'新增记录';let html=field('title','标题',item.title,'text','required maxlength="200"')+field('category','分类／标签',item.category,'text','maxlength="100"')+`<label>内容／备注<textarea name="notes" maxlength="5000">${escape(item.notes||'')}</textarea></label>`;
if(kind==='tasks')html+=options('status','状态',[['todo','待开始'],['doing','进行中'],['done','已完成']],item.status||'todo')+options('priority','优先级',[['high','高'],['medium','中'],['low','低']],item.priority||'medium')+options('goal','关联目标',[['','不关联'],...db.goals.map(g=>[g.id,g.title])],item.goal||'')+field('due','目标日期',item.due,'date');
if(kind==='goals')html+=field('progress','完成度0–100',item.progress??0,'number','required min="0" max="100" step="1"')+field('start','开始日期',item.start,'date')+field('due','结束日期',item.due,'date');
if(kind==='opportunities')html+=options('stage','阶段',['待了解','已申请','面试中','已获得','已结束'].map(s=>[s,s]),item.stage||'待了解')+field('due','跟进日期',item.due,'date');$('#fields').innerHTML=html;$('#dialog').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;query='';render();}if(b.dataset.period){period=b.dataset.period;render();}if(b.dataset.new)edit(b.dataset.new);if(b.dataset.edit){const [k,id]=b.dataset.edit.split(':');edit(k,id);}if(b.dataset.delete){const [k,id]=b.dataset.delete.split(':');if(confirm('删除后无法恢复，确定删除？'))change(x=>{x[k]=x[k].filter(i=>i.id!==id);if(k==='goals')x.tasks.forEach(t=>{if(t.goal===id)t.goal='';});});}if(b.dataset.toggle)change(x=>{const t=x.tasks.find(i=>i.id===b.dataset.toggle);if(t)t.status=t.status==='done'?'todo':'done';});});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#results').innerHTML=page==='tasks'?db.tasks.filter(t=>inPeriod(t)&&(t.title+' '+t.notes+' '+t.category).toLowerCase().includes(query.toLowerCase())).map(task).join(''):cards(page);}});
$('#form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.title=v.title.trim();if(!v.title)return;if(editing.kind==='goals')v.progress=Number(v.progress);const ok=change(x=>{const list=x[editing.kind];if(editing.id){const index=list.findIndex(i=>i.id===editing.id);list[index]={...list[index],...v};}else{const id=globalThis.crypto?.randomUUID?crypto.randomUUID():'record-'+Date.now()+'-'+Math.random().toString(36).slice(2);list.unshift({...v,id,created:new Date().toISOString()});}});if(ok)$('#dialog').close();};$('#cancel').onclick=()=>$('#dialog').close();
$('#backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,data:db},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='工作台备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#restore').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10000000)throw Error('文件过大');const b=JSON.parse(await f.text());if(b.version!==1)throw Error('版本不支持');check(b.data);if(confirm('导入会替换现有数据，建议先导出备份。继续？'))commit(b.data);}catch(error){message('导入失败：'+error.message);}finally{e.target.value='';}};render();if(!storageOK)message('浏览器存储不可用或旧数据无法读取，暂显示初始规划。请检查权限或导入备份；旧数据未被清除。');
</script></html>
