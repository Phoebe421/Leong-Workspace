const KEY='leong-research-v1', CATEGORIES=['诊断／鉴别诊断','病理分级','微血管侵犯','复发预测'], STATUSES=['待开始','进行中','已完成'];
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const initial=()=>({version:1,project:{title:'AI＋普美显增强MRI／CT＋肝癌（暂定）',question:'待确认：以诊断／鉴别诊断，还是病理分级预测为主要研究目标？',stage:'研究问题与数据可行性确认',deadline:'',weekly:'明确主要研究目标\n确认病例来源与病理标签可用性\n建立首批文献证据记录',confirmed:'研究方向：AI＋肝癌影像\n第一版聚焦课题、文献与任务进度'},decisions:['最终做肝癌诊断，还是病理分级预测？','能拿到多少病例？是否同时有MRI和CT？','病理结果是否完整？','自己构建模型，还是验证已有模型？'].map(title=>({id:uid(),title,status:'待确认',notes:''})),papers:[],tasks:[{id:uid(),title:'明确主要预测目标与研究问题',category:'课题设计',priority:'高',status:'待开始',due:'',owner:'我',needs:'与导师确认主要终点',paper:'',notes:'形成一句明确的研究问题，区分诊断、分级、微血管侵犯与复发预测。'},{id:uid(),title:'确认病例来源与标签完整性',category:'数据与授权',priority:'高',status:'待开始',due:'',owner:'待确认',needs:'病例数量、MRI／CT配对情况、病理标签汇总',paper:'',notes:'只记录获准的去标识化汇总信息，不录入患者姓名、住院号或原始影像。'},{id:uid(),title:'建立首批文献证据记录',category:'文献阅读',priority:'中',status:'待开始',due:'',owner:'我',needs:'Zotero全文和引用',paper:'',notes:'按研究目标分类，记录研究设计、验证方式与局限。'}],history:[]});
let state,storageBroken=false;try{const raw=localStorage.getItem(KEY);state=raw?validate(JSON.parse(raw)):initial();}catch(e){state=initial();storageBroken=true;}
let page='overview',query='',category='',taskFilter='',editing=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(s){if(!s||s.version!==1||!s.project||Array.isArray(s.project)||typeof s.project!=='object')throw Error('备份格式不兼容');const expected={project:['title','question','stage','deadline','weekly','confirmed'],papers:['id','title','author','year','category','question','cases','imaging','ai','target','split','validation','results','limits','takeaway','doi','zotero','review','notes'],tasks:['id','title','category','priority','status','due','owner','needs','paper','notes'],decisions:['id','title','status','notes']};const clean={version:1,project:{},papers:[],tasks:[],decisions:[],history:[]};const dateOK=d=>!d||(/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d);function strings(x,fields){if(!x||typeof x!=='object'||Array.isArray(x))throw Error('记录格式错误');const o={};for(const f of fields){const v=x[f]??'';if(typeof v!=='string'||v.length>20000)throw Error('字段格式错误');o[f]=v;}return o;}clean.project=strings(s.project,expected.project);if(!clean.project.title.trim()||!dateOK(clean.project.deadline))throw Error('课题信息无效');for(const k of ['papers','tasks','decisions']){if(!Array.isArray(s[k])||s[k].length>5000)throw Error('备份记录超出限制');const seen=new Set();clean[k]=s[k].map(x=>{const o=strings(x,expected[k]);if(!o.id||seen.has(o.id)||!o.title.trim())throw Error('记录编号或标题无效');seen.add(o.id);if(k==='papers'&&(!CATEGORIES.includes(o.category)||!['待核对','已核对'].includes(o.review)))throw Error('文献分类或核对状态无效');if(k==='tasks'&&(!STATUSES.includes(o.status)||!['高','中','低'].includes(o.priority)||!dateOK(o.due)))throw Error('任务状态或日期无效');if(k==='decisions'&&!['待确认','已确定'].includes(o.status))throw Error('问题状态无效');return o;});}if(clean.tasks.some(t=>t.paper&&!clean.papers.some(p=>p.id===t.paper)))throw Error('关联文献不存在');if(!Array.isArray(s.history)||s.history.length>200)throw Error('历史格式无效');clean.history=s.history.map(h=>{if(!h||typeof h.at!=='string'||isNaN(Date.parse(h.at)))throw Error('历史日期无效');return{at:h.at,project:strings(h.project,expected.project)};});return clean;}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3200);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageBroken=false;return true;}catch(e){storageBroken=true;toast('本机保存失败，请立即导出备份。');return false;}}
function badge(t,cls=''){return `<span class="badge ${cls}">${esc(t)}</span>`;}
function empty(title,text){return `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}</div>`;}
function button(label,kind,id='',extra=''){return `<button data-edit="${kind}" data-id="${esc(id)}" ${extra}>${label}</button>`;}
function heading(k,title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`;}
function card(title,body,action=''){return `<section class="card"><div class="card-head"><h2>${title}</h2>${action}</div>${body}</section>`;}
function sortedTasks(){return state.tasks.filter(t=>t.status!=='已完成').sort((a,b)=>({'高':0,'中':1,'低':2}[a.priority]-{'高':0,'中':1,'低':2}[b.priority])||(a.due||'9999').localeCompare(b.due||'9999'));}
function taskRows(tasks){return tasks.length?tasks.map((t,i)=>`<div class="row"><span class="number">${String(i+1).padStart(2,'0')}</span><div><div class="title">${esc(t.title)}</div><p>${esc(t.category)} · ${t.due?esc(t.due):'尚未安排截止日期'} · ${esc(t.status)}</p></div>${badge(t.priority+'优先',t.priority==='高'?'high':'')}${button('编辑','tasks',t.id)}</div>`).join(''):empty('当前任务已完成','可以为下一阶段添加新的任务。');}
function decisionRows(status){const items=state.decisions.filter(x=>x.status===status);return items.length?items.map(d=>`<div class="decision"><p>${esc(d.title)}</p>${d.notes?`<small>${esc(d.notes)}</small>`:''}<div>${badge(d.status,status==='待确认'?'warn':'')}${button('编辑','decisions',d.id)}</div></div>`).join(''):empty(status==='已确定'?'决定清楚，再往前走':'没有待确认问题','在这里记录决定、依据和确认人。');}
function overview(){const p=state.project,next=sortedTasks()[0],done=state.tasks.filter(t=>t.status==='已完成').length;return heading('A CLEAR NEXT STEP','把研究，推进一步。','AI × 普美显增强MRI／CT × 肝癌 · 从文献到实验，再到论文',button('编辑课题 ↗','project','','class="quiet"'))+`<section class="hero"><div><div class="eyebrow">我下一步要完成什么？</div><h2>${esc(next?.title||'为下一阶段设定一个目标')}</h2><p>${esc(next?.needs||'明确问题，收集证据，留下每一步的依据。')}</p></div>${next?button('查看这项任务 →','tasks',next.id):button('新增任务 →','tasks')}</section><div class="stats"><div class="stat"><small>当前阶段</small><b style="font-size:17px">${esc(p.stage||'待确认')}</b><span>研究方向尚未最终定题</span></div><div class="stat"><small>文献证据</small><b>${state.papers.length}<small> 篇</small></b><span>${state.papers.filter(x=>x.review==='待核对').length}篇待核对原文</span></div><div class="stat"><small>任务进度</small><b>${done}<small> / ${state.tasks.length}</small></b><span>已完成 / 全部任务</span></div><div class="stat"><small>下一个截止日期</small><b style="font-size:20px">${esc(p.deadline||'待安排')}</b><span>不预设尚未确认的节点</span></div></div><div class="grid"><div>${card('研究坐标',`<div class="project-title">${esc(p.title)}</div><dl class="details"><dt>核心研究问题</dt><dd>${esc(p.question||'待补充')}</dd><dt>已明确方向</dt><dd>${esc(p.confirmed||'待补充')}</dd><dt>本周三件事</dt><dd>${esc(p.weekly||'待补充')}</dd></dl>`,badge('暂定课题','warn'))}${card('优先推进',taskRows(sortedTasks().slice(0,3)),'<a class="tiny" href="#tasks">全部任务 →</a>')}</div><div>${card('待确认问题',decisionRows('待确认'),button('＋ 新增','decisions'))}${card('已经确定',decisionRows('已确定'))}</div></div>${aiStrip()}`;}
function safeURL(raw){try{const u=new URL(raw);if(['http:','https:'].includes(u.protocol)&&!u.username&&!u.password)return u.href;}catch{}return '';}
function sourceLinks(p){const doi=p.doi.trim();const link=doi?(doi.startsWith('10.')?'https://doi.org/'+encodeURI(doi):safeURL(doi)):'';const z=/^zotero:\/\/(?:select|open-pdf)\//.test(p.zotero)?p.zotero:safeURL(p.zotero);return [link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">DOI ↗</a>`:'',z?`<a href="${esc(z)}" target="_blank" rel="noopener noreferrer">Zotero ↗</a>`:''].filter(Boolean).join(' · ')||'来源待补充';}
function literature(){const items=state.papers.filter(p=>(!category||p.category===category)&&(!query||[p.title,p.author,p.question,p.target,p.ai,p.notes].join(' ').toLowerCase().includes(query.toLowerCase())));return heading('EVIDENCE, WITH CONTEXT','文献证据库','按研究目标分类，让每一条证据回到原文。',button('＋ 录入文献','papers','','class="primary"'))+`<div class="tools"><input id="paper-search" type="search" placeholder="搜索标题、作者、研究问题或AI方法" aria-label="搜索文献" value="${esc(query)}"><select id="paper-category" aria-label="文献分类"><option value="">全部研究目标</option>${CATEGORIES.map(c=>`<option ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><section class="card"><div class="card-head"><h2>证据记录</h2><small>${items.length} 篇 · 不预填未经核对的文献</small></div>${items.length?`<div class="tablewrap"><table><thead><tr><th>文献 / 原文来源</th><th>研究目标</th><th>病例 / 影像</th><th>验证 / 核对</th><th></th></tr></thead><tbody>${items.map(p=>`<tr><td><strong>${esc(p.title)}</strong><div class="tiny">${esc(p.author)} · ${esc(p.year||'年份待补充')}</div><div class="tiny">${sourceLinks(p)}</div></td><td>${badge(p.category)}<p>${esc(p.target||'预测目标待提取')}</p></td><td>${esc(p.cases||'样本量待提取')}<p class="tiny">${esc(p.imaging||'影像类型待提取')}</p></td><td>${badge(p.review,p.review==='待核对'?'warn':'')}<p class="tiny">${esc(p.validation||'验证方式待提取')}</p></td><td>${button('查看 / 编辑','papers',p.id)}</td></tr>`).join('')}</tbody></table></div>`:empty(state.papers.length?'未找到匹配文献':'从第一篇文献开始','全文和引用留在Zotero；在这里记录研究设计、结果、局限及可借鉴的内容。')}</section>${aiStrip()}`;}
function tasks(){const items=state.tasks.filter(t=>!taskFilter||t.category===taskFilter);const cats=[...new Set(state.tasks.map(t=>t.category))];return heading('SMALL STEPS, REAL PROGRESS','任务进度','每件事都写清：谁协助、需要什么、何时需要、当前进展。',button('＋ 新增任务','tasks','','class="primary"'))+`<div class="tools"><select id="task-category" aria-label="任务分类"><option value="">全部任务类型</option>${cats.map(c=>`<option ${c===taskFilter?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="subtitle">按优先级排列；未确认日期保持空白。</span></div><div class="board">${STATUSES.map(status=>`<section class="column"><h3>${status}<span class="tiny">${items.filter(t=>t.status===status).length}</span></h3>${items.filter(t=>t.status===status).sort((a,b)=>['高','中','低'].indexOf(a.priority)-['高','中','低'].indexOf(b.priority)).map(t=>`<article class="task">${badge(t.category)} ${badge(t.priority+'优先',t.priority==='高'?'high':'')}<h3>${esc(t.title)}</h3><p>截止：${esc(t.due||'待安排')}<br>协助人：${esc(t.owner||'待确认')}<br>需要：${esc(t.needs||'待补充')}</p>${t.notes?`<p>${esc(t.notes)}</p>`:''}${t.paper?`<p>关联文献：${esc(state.papers.find(p=>p.id===t.paper)?.title||'')}</p>`:''}<div class="actions"><select data-status="${esc(t.id)}" aria-label="${esc(t.title)}的状态">${STATUSES.map(x=>`<option ${x===status?'selected':''}>${x}</option>`).join('')}</select>${button('编辑','tasks',t.id)}</div></article>`).join('')||empty('这里还没有任务','将任务移入这个阶段。')}</section>`).join('')}</div>`;}
const later={data:{title:'数据准备',sub:'先确认来源与授权，再接入病例进度。',items:['候选病例 → 符合条件 → 资料完整 → 已标注 → 可分析','MRI／CT配对情况、病理标签完整率、缺失序列及标注进度','只存去标识化编号和获准汇总；原始数据保留在医院批准环境']},experiments:{title:'实验记录',sub:'每一次运行，都能追溯到数据、代码和设置。',items:['实验编号、目标、数据版本与固定患者划分','影像序列、预处理、模型参数与代码版本','完整保留各次实验的结果，区分验证集与固定测试集']},writing:{title:'论文写作',sub:'让段落、图表、实验与文献相互对应。',items:['Introduction / Methods / Results / Discussion','段落 → 实验编号 → 结果表 → 分析代码','导师原意见、修改位置与处理状态；Zotero管理UWE Harvard引用']}};
function roadmap(){const x=later[page];return heading('THE NEXT CHAPTER',x.title,x.sub)+`<section class="card roadmap">${badge('第二阶段 · 尚未接入','warn')}<h2 style="margin-top:20px">研究目标和数据来源明确后，再展开这一层。</h2><ol>${x.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><p class="subtitle">当前版本可在任务进度里先记录授权、资源与准备工作。</p><button id="prep-task" class="primary" style="margin-top:20px">创建准备任务 →</button></section>`;}
function aiStrip(){return `<div class="ai-strip"><div><h3>给研究一点辅助</h3><small>生成提问模板 · AI能力尚未连接 · 输出均需核对</small></div><div class="actions"><button data-ai="extract">提取文献研究设计 ↗</button><button data-ai="check">检查方案遗漏 ↗</button><button data-ai="results">整理结果草稿 ↗</button></div></div>`;}
function render(){page=location.hash.slice(1)||'overview';if(!['overview','literature','tasks',...Object.keys(later)].includes(page))page='overview';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+page));$('#crumb').textContent={overview:'课题总览',literature:'文献证据库',tasks:'任务进度',data:'数据准备',experiments:'实验记录',writing:'论文写作'}[page];$('#main').innerHTML=(storageBroken?'<div class="storage-error">本机存储不可用或记录无法读取。原有存储未覆盖，请先导出当前记录；刷新前联系维护者恢复。</div>':'')+(page==='overview'?overview():page==='literature'?literature():page==='tasks'?tasks():roadmap());}
const schemas={project:[['title','暂定题目'],['question','核心研究问题','textarea'],['stage','当前阶段'],['deadline','下一个截止日期','date'],['weekly','本周三件事（每行一件）','textarea'],['confirmed','已经明确的方向（与待确认问题分开）','textarea']],papers:[['title','文章标题'],['author','作者'],['year','发表年份'],['category','研究分类',CATEGORIES],['question','研究问题','textarea'],['cases','病例数量'],['imaging','影像类型 / 序列'],['ai','AI方法'],['target','预测目标'],['split','数据集 / 患者划分','textarea'],['validation','验证方式','textarea'],['results','主要结果（保留数值、区间、原文位置）','textarea'],['limits','局限','textarea'],['takeaway','我可以借鉴什么','textarea'],['doi','DOI 或原文网页链接'],['zotero','Zotero条目链接'],['review','原文核对状态',['待核对','已核对']],['notes','补充备注','textarea']],tasks:[['title','任务名称'],['category','任务类型',['课题设计','文献阅读','数据与授权','实验准备','论文写作','导师沟通','计算资源','毕业节点']],['priority','优先级',['高','中','低']],['status','进展状态',STATUSES],['due','截止日期','date'],['owner','需要谁协助'],['needs','需要什么'],['paper','关联文献','paper'],['notes','目标 / 当前进展','textarea']],decisions:[['title','问题 / 决定'],['status','状态',['待确认','已确定']],['notes','依据 / 确认人 / 确认日期','textarea']]};
function openEditor(kind,id='',preset={}){editing={kind,id};const obj=kind==='project'?state.project:state[kind].find(x=>x.id===id)||preset;$('#form-title').textContent={project:'编辑课题总览',papers:'文献证据记录',tasks:'任务安排',decisions:'研究问题与决定'}[kind];$('#form-error').textContent='';$('#fields').innerHTML='<div class="form-grid">'+schemas[kind].map(([key,label,type])=>{const value=obj[key]??(kind==='papers'&&key==='review'?'待核对':'');let control;if(Array.isArray(type))control=`<select name="${key}">${type.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`;else if(type==='paper')control=`<select name="${key}"><option value="">暂不关联</option>${state.papers.map(p=>`<option value="${esc(p.id)}" ${p.id===value?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea name="${key}" rows="3" maxlength="20000">${esc(value)}</textarea>`;else control=`<input name="${key}" type="${type||'text'}" value="${esc(value)}" maxlength="20000" ${key==='title'?'required':''}>`;return `<label class="${type==='textarea'||key==='title'?'wide':''}">${label}${control}</label>`;}).join('')+'</div>'+(kind==='project'&&state.history.length?`<p class="history">保留了 ${state.history.length} 次课题修改快照，包含在导出备份中。最近：${esc(new Date(state.history.at(-1).at).toLocaleString('zh-CN'))}</p>`:'')+(id?'<button type="button" id="remove-record" class="quiet">删除这条记录</button>':'');$('#editor').showModal();}
$('#form').addEventListener('submit',e=>{e.preventDefault();const {kind,id}=editing,values=Object.fromEntries(new FormData(e.target));for(const k in values)values[k]=values[k].trim();if(!values.title){$('#form-error').textContent='请填写标题';return;}if(kind==='papers'){if(values.doi&&!/^10\.\d{4,9}\/.+/.test(values.doi)&&!safeURL(values.doi)){$('#form-error').textContent='请填写有效DOI或http(s)网页链接';return;}if(values.zotero&&!/^zotero:\/\/(select|open-pdf)\//.test(values.zotero)&&!safeURL(values.zotero)){$('#form-error').textContent='请填写有效Zotero条目或网页链接';return;}}if(kind==='project'){state.history.push({at:new Date().toISOString(),project:{...state.project}});state.history=state.history.slice(-200);state.project=values;}else if(id){state[kind]=state[kind].map(x=>x.id===id?{...x,...values}:x);}else state[kind].push({...values,id:uid()});const ok=persist();$('#editor').close();render();if(ok)toast('已保存在当前浏览器');});
document.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]');if(edit){openEditor(edit.dataset.edit,edit.dataset.id);return;}if(e.target.closest('[data-close]'))$('#editor').close();if(e.target.closest('[data-assistant-close]'))$('#assistant').close();if(e.target.id==='remove-record'){if(!await askConfirm('确认删除这条记录？建议先导出备份。'))return;const{kind,id}=editing;state[kind]=state[kind].filter(x=>x.id!==id);if(kind==='papers')state.tasks.forEach(t=>{if(t.paper===id)t.paper='';});persist();$('#editor').close();render();toast('已删除记录');}if(e.target.id==='prep-task')openEditor('tasks','',{title:'准备'+later[page].title+'模块',category:page==='data'?'数据与授权':page==='experiments'?'实验准备':'论文写作',priority:'中',status:'待开始'});if(e.target.dataset.ai)openAssistant(e.target.dataset.ai);});
document.addEventListener('change',e=>{if(e.target.id==='paper-category'){category=e.target.value;render();}if(e.target.id==='task-category'){taskFilter=e.target.value;render();}if(e.target.dataset.status){const t=state.tasks.find(t=>t.id===e.target.dataset.status);if(t){t.status=e.target.value;persist();render();}}});
document.addEventListener('input',e=>{if(e.target.id==='paper-search'){query=e.target.value;const pos=e.target.selectionStart;render();$('#paper-search').focus();$('#paper-search').setSelectionRange(pos,pos);}});
function download(filename,text){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('#backup').onclick=()=>download('leong-research-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2));$('#restore').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('备份不能超过8MB');const incoming=validate(JSON.parse(await f.text()));if(!await askConfirm(`将替换当前课题、${state.papers.length}篇文献和${state.tasks.length}项任务。确定导入${incoming.papers.length}篇文献与${incoming.tasks.length}项任务？请先保留导出备份。`))return;state=incoming;persist();render();toast('备份已导入');}catch(err){toast('无法导入：'+err.message);}finally{e.target.value='';}};
function openAssistant(type){const p=state.project;const sources=state.papers.map(x=>`[${x.id}] ${x.title}\nDOI：${x.doi||'待补充'}；Zotero：${x.zotero||'待补充'}；核对状态：${x.review}`).join('\n\n');const title={extract:'提取文献研究设计',check:'检查方案遗漏',results:'根据实验记录整理结果草稿'}[type];let text=`你是科研方法助手。课题：${p.title}\n研究问题：${p.question}\n\n请遵守：只依据我提供的原文或实验记录；每条结论标注来源与原文页码/表格或实验编号；缺失信息写“未提供”；所有输出标注“待核对”；不得虚构样本、指标、参考文献或实验结果。\n\n`;if(type==='extract')text+='请逐项提取作者年份、研究问题、病例数、影像类型、AI方法、预测目标、患者划分、验证、结果与区间、局限和可借鉴内容。将研究目标分类为诊断／鉴别诊断、病理分级、微血管侵犯或复发预测。\n\n原文及位置：[请在此提供全文或节选]\n\n已有来源索引：\n'+(sources||'暂无，先提供真实原文。');if(type==='check')text+='请检查主要终点、纳排标准、病例来源、MRI/CT配对、病理标签、数据泄漏、患者级划分、固定测试集、外部验证、缺失值、统计分析、伦理与数据授权是否明确。输出“已说明 / 待确认 / 建议补充”，不要替我作未经确认的决定。\n\n已明确方向：'+p.confirmed+'\n待确认：'+state.decisions.filter(x=>x.status==='待确认').map(x=>x.title).join('；')+'\n\n研究方案全文：[请在此补充]';if(type==='results')text+='当前工作台尚未接入实验记录，因此不能据此写真实Results。请等待我提供实验编号、数据与代码版本、固定划分、完整指标、置信区间和图表，再整理结果草稿；每句话映射到实验与表格。没有数据的地方保留占位。\n\n实验记录：[待提供]\n图表与分析代码：[待提供]';$('#assistant-title').textContent=title;$('#prompt-output').value=text;$('#assistant').showModal();}
$('#copy-prompt').onclick=async()=>{try{await navigator.clipboard.writeText($('#prompt-output').value);toast('已复制提问模板');}catch{$('#prompt-output').focus();$('#prompt-output').select();toast('请按复制快捷键复制已选中的模板');}};
window.addEventListener('hashchange',render);render();

function askConfirm(message){return new Promise(resolve=>{const d=document.createElement('dialog');d.innerHTML='<h2>请确认操作</h2><p>'+esc(message)+'</p><div class="actions"><button data-no class="quiet">取消</button><button data-yes class="primary">确认</button></div>';document.body.append(d);const finish=v=>{d.close();d.remove();resolve(v);};d.querySelector('[data-no]').onclick=()=>finish(false);d.querySelector('[data-yes]').onclick=()=>finish(true);d.oncancel=e=>{e.preventDefault();finish(false);};d.showModal();});}
</script></body></html>
