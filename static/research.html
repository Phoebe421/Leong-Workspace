function validateV1(s){if(!s||s.version!==1||!s.project||Array.isArray(s.project)||typeof s.project!=='object')throw Error('备份格式不兼容');const expected={project:['title','question','stage','deadline','weekly','confirmed'],papers:['id','title','author','year','category','question','cases','imaging','ai','target','split','validation','results','limits','takeaway','doi','zotero','review','notes'],tasks:['id','title','category','priority','status','due','owner','needs','paper','notes'],decisions:['id','title','status','notes']};const clean={version:1,project:{},papers:[],tasks:[],decisions:[],history:[]};const dateOK=d=>!d||(/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d);function strings(x,fields){if(!x||typeof x!=='object'||Array.isArray(x))throw Error('记录格式错误');const o={};for(const f of fields){const v=x[f]??'';if(typeof v!=='string'||v.length>20000)throw Error('字段格式错误');o[f]=v;}return o;}clean.project=strings(s.project,expected.project);if(!clean.project.title.trim()||!dateOK(clean.project.deadline))throw Error('课题信息无效');for(const k of ['papers','tasks','decisions']){if(!Array.isArray(s[k])||s[k].length>5000)throw Error('备份记录超出限制');const seen=new Set();clean[k]=s[k].map(x=>{const o=strings(x,expected[k]);if(!o.id||seen.has(o.id)||!o.title.trim())throw Error('记录编号或标题无效');seen.add(o.id);if(k==='papers'&&(!CATEGORIES.includes(o.category)||!['待核对','已核对'].includes(o.review)))throw Error('文献分类或核对状态无效');if(k==='tasks'&&(!STATUSES.includes(o.status)||!['高','中','低'].includes(o.priority)||!dateOK(o.due)))throw Error('任务状态或日期无效');if(k==='decisions'&&!['待确认','已确定'].includes(o.status))throw Error('问题状态无效');return o;});}if(clean.tasks.some(t=>t.paper&&!clean.papers.some(p=>p.id===t.paper)))throw Error('关联文献不存在');if(!Array.isArray(s.history)||s.history.length>200)throw Error('历史格式无效');clean.history=s.history.map(h=>{if(!h||typeof h.at!=='string'||isNaN(Date.parse(h.at)))throw Error('历史日期无效');return{at:h.at,project:strings(h.project,expected.project)};});return clean;}

function tasks(){const items=state.tasks.filter(t=>!taskFilter||t.category===taskFilter);const cats=[...new Set(state.tasks.map(t=>t.category))];return heading('阶段任务','接下来做什么？','写清协助人、资料、阶段和截止日期。',button('＋ 新增任务','tasks','','class="primary"'))+`<div class="tools"><select id="task-category" aria-label="任务分类"><option value="">全部任务类型</option>${cats.map(c=>`<option ${c===taskFilter?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="subtitle">按优先级排列；未确认日期保持空白。</span></div><div class="board">${STATUSES.map(status=>`<section class="column"><h3>${status}<span class="tiny">${items.filter(t=>t.status===status).length}</span></h3>${items.filter(t=>t.status===status).sort((a,b)=>['高','中','低'].indexOf(a.priority)-['高','中','低'].indexOf(b.priority)).map(t=>`<article class="task">${badge(t.category)} ${badge(t.priority+'优先',t.priority==='高'?'high':'')}<h3>${esc(t.title)}</h3><p>${esc(stageTitle(t.stage))}<br>截止：${esc(t.due||'待安排')}<br>协助人：${esc(t.owner||'待确认')}<br>需要：${esc(t.needs||'待补充')}</p>${t.notes?`<p>${esc(t.notes)}</p>`:''}${t.paper?`<p>关联文献：${esc(state.papers.find(p=>p.id===t.paper)?.title||'')}</p>`:''}<div class="actions"><select data-status="${esc(t.id)}" aria-label="${esc(t.title)}的状态">${STATUSES.map(x=>`<option ${x===status?'selected':''}>${x}</option>`).join('')}</select>${button('编辑','tasks',t.id)}</div></article>`).join('')||empty('这里还没有任务','将任务移入这个阶段。')}</section>`).join('')}</div>`;}

 feedback:[['title','导师原意见','textarea'],['location','修改位置 / 章节'],['status','处理状态',['待处理','处理中','已处理','需再确认']],['response','实际修改与回复说明','textarea'],['due','截止日期','date']]
});
const KIND_NAMES={project:'改课题与方案',papers:'记一篇文献',tasks:'安排任务',decisions:'记录决定',stages:'这一步做到哪里了',candidates:'研究问题候选',resources:'向老师确认数据',dictionary:'数据字典字段',cohorts:'病例进度汇总',quality:'数据问题',experiments:'记录这次实验',analyses:'记录分析与图表',drafts:'写论文',feedback:'处理导师意见'};
function recordCards(kind,description){const items=state[kind];return items.length?`<div class="record-grid">${items.map(x=>`<article class="record-card"><div>${badge(x.status||x.review||'已记录')}</div><h3>${esc(x.title)}</h3>${schemas[kind].filter(([k])=>!['title','status','review'].includes(k)&&x[k]).sort((a,b)=>kind==='experiments'?(['objective','version','code','results'].indexOf(a[0])<0?9:['objective','version','code','results'].indexOf(a[0]))-(['objective','version','code','results'].indexOf(b[0])<0?9:['objective','version','code','results'].indexOf(b[0])):0).slice(0,kind==='cohorts'?8:4).map(([k,l])=>`<p><small>${esc(l)}</small>${esc(k==='paper'?state.papers.find(p=>p.id===x[k])?.title:k==='experiment'?state.experiments.find(p=>p.id===x[k])?.title:x[k])}</p>`).join('')}${button('查看 / 编辑',kind,x.id)}</article>`).join('')}</div>`:empty('还没记录',description);}
function section(kind,title,desc){return card(title,recordCards(kind,desc),button('＋ 新增',kind));}
function routeMap(){return `<section class="card"><div class="card-head"><h2>从定题到交论文，走这7步</h2><small>当前第 ${esc(state.project.currentStage)} 步 · 写作同时进行</small></div><div class="route-map">${state.stages.map((s,i)=>`<button data-edit="stages" data-id="${s.id}" class="route-stop ${state.project.currentStage===String(i+1)?'current':''}"><span>${s.status==='已完成'?'✓':String(i+1).padStart(2,'0')}</span><b>${esc(s.title)}</b><small>${esc(s.status)}</small></button>`).join('')}</div><p class="tiny">点击每一步，查看资料、决定、交付成果和同时要写的章节。阶段由你确认，不会自动跳过。</p></section>`;}
function overview(){const p=state.project,next=sortedTasks()[0],current=state.stages[+p.currentStage-1];return `<div class="welcome"><div><div class="eyebrow">MY LITTLE RESEARCH CITY ✦</div><h1>今天，先把这件事做好。</h1><p>你的肝脏影像AI研究，慢慢走，也要每一步都算数。</p></div><span class="sticker">ONE STEP<br>AT A TIME ♡</span></div><section class="hero pink-hero"><div class="hero-copy"><span class="badge high">第 ${esc(p.currentStage)} 步 · ${esc(current.title)}</span><h2>${esc(next?.title||'看看本阶段还有什么要做')}</h2><p>${esc(next?.needs||current.outputs)}</p>${next?button('开始这件事 →','tasks',next.id,'class="primary"'):button('记录阶段进展 →','stages',current.id,'class="primary"')}</div><div class="animal-scene"><span class="bubble">小步也算进步！</span><div class="animal bunny">${mascot()}</div><div class="animal fox">${mascot('fox')}</div><div class="cityline"><i></i><i></i><i></i><i></i><i></i></div><span class="spark">✦</span></div></section><div class="quick-strip"><a href="#literature"><b>${state.papers.length}</b> 篇文献</a><a href="#writing"><b>${state.tasks.filter(x=>x.status!=='已完成').length}</b> 件待办</a><span>下个截止日 <b>${esc(p.deadline||'还没定')}</b></span><span>现在该写 <b>${esc(current.writing)}</b></span></div>${routeMap()}<div class="grid"><div>${card('我的课题',`<h3>${esc(p.title)}</h3><dl class="details"><dt>研究问题</dt><dd>${esc(p.question)}</dd><dt>已经明确</dt><dd>${esc(p.confirmed)}</dd><dt>本周做这3件</dt><dd>${esc(p.weekly)}</dd></dl>`,button('修改','project'))}${section('candidates','先比较，再定题','写清患者、资料、方法、目标和验证方式。')}</div><div>${card('现在要确认',decisionRows('待确认'),button('＋ 新增','decisions'))}${card('已经决定',decisionRows('已确定'))}</div></div>${aiStrip()}`;}
function dataPage(){return heading('03 / 数据准备','数据能不能用，先看这里。','只记获准的汇总和文件位置；原始影像与身份信息留在批准环境。')+`<div class="page-hint">先问清数据，再收集整理。MRI与CT配对、病理标签、授权手续都要有记录。</div>`+section('resources','数据资源清单','把要向黄老师核实的问题写进来。')+section('cohorts','病例筛选与标注进度','记录批次和汇总数量，保留纳入、排除与标注复核依据。')+`<div class="grid"><div>${section('dictionary','数据字典','说明字段含义、单位、缺失值和取值规则。')}</div><div>${section('quality','数据质量问题','记录缺失序列、图像质量、检查时间和复核进度。')}</div></div><div class="page-hint">同一患者的病灶与多次检查必须保留关联。训练与测试按患者划分。</div>`;}
function experimentPage(){return heading('04 / 实验与结果','每个结果，都找得到来处。','先跑通基础流程，再增加复杂度。保留每次实验，包括没有提高的结果。',button('＋ 记录实验','experiments','','class="primary"'))+`<div class="page-hint">训练与验证用于开发；固定测试集用于最终评价。标准化、特征筛选等学习步骤只在训练流程内拟合。</div>`+section('experiments','实验记录','记录数据、划分、代码、参数、模型和预测文件位置。')+section('analyses','分析、图表与结论','关联实验，再记录指标、置信区间、比较和误判分析。')+aiStrip();}
function writingPage(){return heading('05 / 论文与任务','边做边写，就不会忘。','定题时写背景，制定方案时写方法；分析后补结果、讨论，最后写摘要。')+section('drafts','论文草稿','新增章节并关联文献、实验、图表和分析来源。')+section('feedback','导师意见','保留原意见、修改位置和实际处理说明。')+`<div class="page-hint">引用由 Zotero 管理，最后统一为 UWE Harvard。工作台保存章节与证据的对应关系。</div>`+tasks();}
function render(){page=location.hash.slice(1)||'overview';if(page==='tasks')page='writing';if(!['overview','literature','data','experiments','writing'].includes(page))page='overview';document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('active',a.hash==='#'+page);if(a.hash==='#'+page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});$('#crumb').textContent={overview:'课题与决策',literature:'文献证据',data:'数据准备',experiments:'实验与结果',writing:'论文与任务'}[page];$('#main').innerHTML=(storageBroken?'<div class="storage-error">本机记录读取或保存失败。请先导出备份，不要清除浏览器数据。</div>':'')+({overview,literature,data:dataPage,experiments:experimentPage,writing:writingPage}[page]());}
function unlinkRecord(kind,id){if(kind==='papers')for(const k of ['tasks','experiments','drafts'])state[k].forEach(t=>{if(t.paper===id)t.paper='';});if(kind==='experiments')for(const k of ['analyses','drafts'])state[k].forEach(t=>{if(t.experiment===id)t.experiment='';});}

window.addEventListener('hashchange',render);render();

function askConfirm(message){return new Promise(resolve=>{const d=document.createElement('dialog');d.innerHTML='<h2>请确认操作</h2><p>'+esc(message)+'</p><div class="actions"><button data-no class="quiet">取消</button><button data-yes class="primary">确认</button></div>';document.body.append(d);const finish=v=>{d.close();d.remove();resolve(v);};d.querySelector('[data-no]').onclick=()=>finish(false);d.querySelector('[data-yes]').onclick=()=>finish(true);d.oncancel=e=>{e.preventDefault();finish(false);};d.showModal();});}
</script></body></html>
